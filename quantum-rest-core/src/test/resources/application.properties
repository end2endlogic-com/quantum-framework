# The inherited Morphia extension requires an explicit test connection. Usage-governance
# tests do not use MongoDB; the short loopback timeout prevents accidental remote access.
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.connection-string=mongodb://localhost:27017/?retryWrites=false&serverSelectionTimeoutMS=100
quarkus.morphia.database=test-quantum-rest-core
quarkus.morphia.packages=com.e2eq.framework.model.persistent.security,com.e2eq.framework.model.persistent.base,com.e2eq.framework.model.persistent.morphia,com.e2eq.framework.model.persistent.migration.base,com.e2eq.framework.persistent
quantum.realmConfig.defaultRealm=test-quantum-rest-core
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
