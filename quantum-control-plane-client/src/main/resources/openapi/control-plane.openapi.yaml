openapi: 3.0.3
info:
  title: Quantum Control-Plane API (tenant -> system seam)
  version: 1.1.0
  description: >
    The queries a tier-2 (quantum.mode=remote) deployment makes against the
    control plane (quantum-system): realm catalog resolution and membership/
    role resolution for routing. Authentication is NOT here by design — the
    tenant plane validates platform JWTs against the control plane's JWKS
    (/oauth/jwks); credential material never crosses this seam. The one
    identity read (1.1.0, tag identity) returns only a credential's flat
    (global) role names and userId for a stable subject, to trusted service
    principals. Java consumers: RemoteSystemDirectory / remote
    RealmMembershipService in quantum-system implement their contracts over
    this API.
servers:
  - url: http://quantum-system:8080
security:
  - bearerAuth: []
paths:
  /control/realms/by-domain/{emailDomain}:
    get:
      operationId: findRealmByEmailDomain
      parameters:
        - { name: emailDomain, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: catalog entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealmCatalogEntry' }
        '404': { description: no realm for that domain }
  /control/realms/{refName}:
    get:
      operationId: findRealmByRefName
      parameters:
        - { name: refName, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: catalog entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealmCatalogEntry' }
        '404': { description: unknown realm }
    put:
      operationId: registerRealm
      summary: Create or update a realm catalog entry (owner-plane operation)
      parameters:
        - { name: refName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealmCatalogEntry' }
      responses:
        '200':
          description: registered entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealmCatalogEntry' }
  /control/realms/{refName}/members:
    get:
      operationId: membersOfRealm
      parameters:
        - { name: refName, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: org/account memberships (one owner, N participants)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RealmMembershipEntry' }
  /control/realms/{refName}/members/{organizationRefName}:
    put:
      operationId: upsertRealmMembership
      summary: Create or update an organization membership in a realm
      parameters:
        - { name: refName, in: path, required: true, schema: { type: string } }
        - { name: organizationRefName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RealmMembershipEntry' }
      responses:
        '200':
          description: reconciled realm membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealmMembershipEntry' }
  /control/users/{userId}/realms:
    get:
      operationId: realmsForUser
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: the user's per-realm role assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserRealmRoleEntry' }
  /control/users/{userId}/realms/{realmRefName}:
    put:
      operationId: upsertUserRealmRole
      summary: Create or update a user's role assignment in a realm
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: realmRefName, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRealmRoleEntry' }
      responses:
        '200':
          description: reconciled user realm-role assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRealmRoleEntry' }
  /control/identity/flat-roles:
    get:
      tags: [identity]
      operationId: flatRolesForSubject
      summary: Flat (global) roles of the credential bound to a stable subject
      description: >
        Added in 1.1.0. Service-to-service only: the caller must be an
        authorized service principal on the identity authority (an active
        SERVICE account credential holding the flat role
        control-plane-identity, minted by a holder of the flat system role);
        end-user and other tokens are refused with 403. Returns the flat
        credential roles, which apply in every realm, and the credential's
        userId so the caller can confirm the token's userId matches. Realm-
        scoped (UserRealmRole) roles are never included. Credential material
        (password hashes, secrets, IdP configuration) is never returned. A
        disabled credential (activeStatus INACTIVE or DELETED) returns 200
        with active=false and an empty role list, so a caller can never carry
        a role for it. Every call is audited by the identity authority.
      parameters:
        - name: subject
          in: query
          required: true
          description: the token's stable subject (sub claim), not the userId
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: the credential's flat roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectFlatRolesEntry' }
        '400':
          description: subject missing or blank
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneProblem' }
        '401': { description: missing or invalid bearer token }
        '403':
          description: caller is not a trusted service principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneProblem' }
        '404':
          description: >
            no credential is bound to that subject (code SUBJECT_NOT_FOUND);
            a 404 without that code is not an answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneProblem' }
        '501':
          description: this control plane is not the identity authority (code IDENTITY_NOT_HOSTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneProblem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    SubjectFlatRolesEntry:
      type: object
      description: flat (global) roles of one credential; never realm-scoped roles, never credential material
      required: [subject, userId, active, roles]
      properties:
        subject: { type: string, description: "the stable subject the credential is bound to" }
        userId: { type: string, description: "the credential's userId; callers must check it matches the token's userId" }
        active: { type: boolean, description: "false when the credential is disabled (activeStatus INACTIVE or DELETED); roles is then empty" }
        roles: { type: array, items: { type: string }, description: "flat credential roles; apply in every realm the user can reach" }
    ControlPlaneProblem:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "stable machine-readable refusal code" }
        message: { type: string }
    RealmCatalogEntry:
      type: object
      required: [refName]
      properties:
        refName: { type: string }
        displayName: { type: string }
        databaseName: { type: string }
        deploymentType:
          type: string
          enum: [DEDICATED, SHARED]
          default: DEDICATED
          description: "realm persistence topology; absent legacy values mean DEDICATED"
        tenancyMode:
          type: string
          enum: [SINGLE_TENANT, MULTI_TENANT]
          default: SINGLE_TENANT
          description: "tenant-selection contract; multi-tenant realms validate the signed token tenant or an explicit X-Tenant-Id switch"
        emailDomain: { type: string }
        defaultAdminUserId: { type: string, description: "registered realm administrator; never inferred from the email domain by remote consumers" }
        dataSegment: { type: integer, format: int32, default: 0 }
        tenantId: { type: string }
        orgRefName: { type: string }
        accountNumber: { type: string }
        connectionString: { type: string, description: "realm datastore address; control plane may withhold for non-owner callers" }
        active: { type: boolean, default: true }
    RealmMembershipEntry:
      type: object
      required: [realmRefName, organizationRefName, membershipRole]
      properties:
        realmRefName: { type: string }
        organizationRefName: { type: string }
        accountId: { type: string }
        tenantId: { type: string }
        membershipRole: { type: string, enum: [owner, participant] }
        participationStatus: { type: string }
        id:
          type: string
          description: MongoDB ObjectId as String
        refName:
          type: string
          minLength: 3
        displayName:
          type: string
        dataDomain:
          $ref: '#/components/schemas/ControlPlaneDataDomain'
        activeStatus:
          $ref: '#/components/schemas/ControlPlaneActiveStatus'
        tags:
          type: array
          items:
            type: string
        advancedTags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ControlPlaneTag'
        auditInfo:
          $ref: '#/components/schemas/ControlPlaneAuditInfo'
        references:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ControlPlaneReferenceEntry'
        persistentEvents:
          type: array
          items:
            $ref: '#/components/schemas/ControlPlanePersistentEvent'
        signatures:
          $ref: '#/components/schemas/ControlPlaneSignatures'
        unmappedProperties:
          type: object
          additionalProperties: {}
          description: Additional properties that are not mapped to any field in the java
            class but existed in Mongodb
        version:
          type: integer
          format: int64
        realmDisplayName:
          type: string
        realmEmailDomain:
          type: string
        defaultAdminUserId:
          type: string
        realmEditionRefName:
          type: string
        provisioningMode:
          type: string
        setupStatus:
          type: string
        setupCompletionPercent:
          type: integer
          format: int32
    UserRealmRoleEntry:
      type: object
      required: [userId, realmRefName, roles]
      properties:
        userId: { type: string }
        realmRefName: { type: string }
        roles: { type: array, items: { type: string } }
        authorizedApplications: { type: array, items: { type: string } }
        defaultApplication: { type: string }
        authorizedTenantIds: { type: array, items: { type: string } }
        sponsoringOrgRefName: { type: string }
        status: { type: string, enum: [active, invited, suspended] }
        id:
          type: string
          description: MongoDB ObjectId as String
        refName:
          type: string
          minLength: 3
        displayName:
          type: string
        dataDomain:
          $ref: '#/components/schemas/ControlPlaneDataDomain'
        activeStatus:
          $ref: '#/components/schemas/ControlPlaneActiveStatus'
        tags:
          type: array
          items:
            type: string
        advancedTags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ControlPlaneTag'
        auditInfo:
          $ref: '#/components/schemas/ControlPlaneAuditInfo'
        references:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ControlPlaneReferenceEntry'
        persistentEvents:
          type: array
          items:
            $ref: '#/components/schemas/ControlPlanePersistentEvent'
        signatures:
          $ref: '#/components/schemas/ControlPlaneSignatures'
        unmappedProperties:
          type: object
          additionalProperties: {}
          description: Additional properties that are not mapped to any field in the java
            class but existed in Mongodb
        version:
          type: integer
          format: int64
        subject:
          type: string
        authorizedTenantRegEx:
          type: string
    ControlPlaneSignatures:
      type: object
      properties:
        referencesSignature:
          type: string
        auditInfoSignature:
          type: string
        entityHash:
          type: string
    ControlPlanePersistentEvent:
      type: object
      properties:
        eventType:
          type: string
        eventMessage:
          type: string
        eventDate:
          $ref: '#/components/schemas/ControlPlaneDate'
        userId:
          type: string
        version:
          type: integer
          format: int64
        eventData:
          type: object
          additionalProperties: {}
    ControlPlaneDate:
      type: integer
      format: int64
      description: UTC timestamp in milliseconds since the Unix epoch; preserves audit and event precision.
    ControlPlaneReferenceEntry:
      type: object
      required:
      - referencedId
      - type
      properties:
        referencedId:
          type: string
          description: MongoDB ObjectId as String
        type:
          type: string
        refName:
          type: string
    ControlPlaneAuditInfo:
      type: object
      properties:
        creationTs:
          $ref: '#/components/schemas/ControlPlaneDate'
        creationIdentity:
          type: string
        lastUpdateTs:
          $ref: '#/components/schemas/ControlPlaneDate'
        lastUpdateIdentity:
          type: string
        impersonatorSubject:
          type: string
        impersonatorUserId:
          type: string
        actingOnBehalfOfSubject:
          type: string
        actingOnBehalfOfUserId:
          type: string
    ControlPlaneTag:
      type: object
      properties:
        category:
          type: string
        tagDisplayName:
          type: string
        additionalData:
          type: array
          uniqueItems: true
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ControlPlaneStringNameValue'
        visible:
          type: boolean
    ControlPlaneStringNameValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    ControlPlaneActiveStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - DELETED
    ControlPlaneDataDomain:
      type: object
      required:
      - orgRefName
      - accountNum
      - tenantId
      - dataSegment
      - ownerId
      properties:
        orgRefName:
          type: string
        accountNum:
          type: string
        tenantId:
          type: string
          minLength: 1
        dataSegment:
          type: integer
          format: int32
        ownerId:
          type: string
          minLength: 1
        businessTransactionId:
          type: string
        locationId:
          type: string
