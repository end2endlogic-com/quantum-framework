openapi: 3.0.3
info:
  title: Quantum CLI authentication contract
  version: 1.4.2
paths:
  /security/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authentication response (additional producer fields are retained by the service)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
  /security/service-token:
    post:
      tags: [Auth]
      operationId: mintServiceToken
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: {type: string}
        - name: X-Realm
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceTokenRequest'}
      responses:
        '200':
          description: Issued service token (Auth contract 4.10.0, identity only)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceTokenResponse'}
components:
  schemas:
    LoginRequest:
      type: object
      required: [userId, password]
      properties:
        userId: {type: string}
        password: {type: string}
    LoginResponse:
      type: object
      additionalProperties: true
      properties:
        access_token: {type: string}
    ServiceTokenRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [application, delegating]}
        realm: {type: string, nullable: true}
        description: {type: string, nullable: true}
    ServiceTokenResponse:
      type: object
      additionalProperties: true
      required: [token, subject, userId, kind, realm]
      properties:
        token: {type: string}
        credentialId: {type: string}
        subject: {type: string}
        userId: {type: string}
        kind: {type: string}
        realm: {type: string}
        tenantId: {type: string, nullable: true}
        description: {type: string, nullable: true}
