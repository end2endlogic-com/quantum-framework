# Isolated test configuration. The included keys are disposable test fixtures only.
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.connection-string=mongodb://localhost:27017/?retryWrites=false
quarkus.mongodb.database=test-security-lifecycle
quarkus.morphia.database=test-security-lifecycle
quarkus.morphia.packages=com.e2eq.framework.model.persistent.security,com.e2eq.framework.model.persistent.base
quarkus.morphia.create-caps=false
quarkus.morphia.create-indexes=false
quarkus.morphia.create-validators=false
quantum.realmConfig.defaultRealm=test-security-lifecycle
auth.provider=custom
quantum.auth.trust-token-claims=true
quantum.security.session.application-id=app-a
quantum.security.session.realm=tenant-a
mp.jwt.verify.issuer=https://lifecycle.invalid
mp.jwt.verify.publickey.location=lifecycle-test-public.pem
smallrye.jwt.sign.key.location=lifecycle-test-private.pem
quantum.database.scope=DEV
quantum.database.version=1.0.0

quantum.database.migration.enabled=true
